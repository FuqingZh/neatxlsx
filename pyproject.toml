[project]
name = "neatxlsx"
dynamic = ["version"]
description = "Opinionated XLSX report-table writer for Polars."
dependencies = ["polars>=1.38.1"]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"

[[project.authors]]
name = "Fuqing Zhang"
email = "fu.qing.zhang.work@gmail.com"

[project.optional-dependencies]
dev = ["build>=1.3.0", "hypothesis>=6.135.0", "maturin<2.0,>=1.11.5", "openpyxl>=3.1.5", "pytest>=9.0.2", "pyright>=1.1.408", "ruff>=0.15.18", "uv>=0.8.0"]

[build-system]
requires = ["maturin>=1.11.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/neatxlsx_py/Cargo.toml"
python-source = "python"
module-name = "neatxlsx._native"
bindings = "pyo3"
features = ["pyo3/extension-module"]

[[tool.maturin.include]]
path = "LICENSE"
format = ["sdist", "wheel"]

[tool.pdm]
distribution = true
use_uv = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
