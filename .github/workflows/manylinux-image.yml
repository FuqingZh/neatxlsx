name: manylinux-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: x86_64
            base: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: aarch64
            base: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .github/docker/manylinux-rust
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            RUST_TOOLCHAIN=1.96.1
          tags: ghcr.io/fuqingzh/neatxlsx-manylinux_2_28-rust:rust-1.96.1-${{ matrix.arch }}

