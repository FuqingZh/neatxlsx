name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13", "3.14"]
    runs-on: ubuntu-latest
    env:
      PDM_VENV_IN_PROJECT: "1"
      PDM_IGNORE_SAVED_PYTHON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -U pdm
      - run: pdm sync -G dev
      - run: pdm run develop
      - run: pdm run test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install -U pdm
      - run: pdm sync -G dev
      - run: pdm run develop
      - run: pdm run lint
      - run: pdm run typecheck
      - run: pdm run rust-format
      - run: pdm run rust-lint
      - run: pdm run rust-test
      - run: pdm run package
