name: build-release

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-14
            arch: arm64
          - os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: runner.os == 'Linux'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install -U cibuildwheel
      - name: Build wheel
        env:
          CIBW_BUILD: "cp311-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: ghcr.io/fuqingzh/neatxlsx-manylinux_2_28-rust:rust-1.96.1-x86_64
          CIBW_MANYLINUX_AARCH64_IMAGE: ghcr.io/fuqingzh/neatxlsx-manylinux_2_28-rust:rust-1.96.1-aarch64
          CIBW_ENVIRONMENT_LINUX: RUSTUP_TOOLCHAIN=1.96.1
          CIBW_TEST_COMMAND: >-
            python -c "import neatxlsx; assert neatxlsx.Workbook"
        run: python -m cibuildwheel --output-dir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -U maturin
      - run: maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  bundle:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release
          merge-multiple: true
      - name: Validate release distributions
        run: |
          python -m pip install -U twine
          version="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"])')"
          python scripts/validate_dist.py \
            --dist-dir release \
            --expected-version "${version}" \
            --expected-wheel-count 5 \
            --require-sdist
          python -m twine check release/*
      - name: Write immutable release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import tomllib
          from pathlib import Path
          files = []
          version = tomllib.loads(Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          for path in sorted(Path("release").iterdir()):
              if path.is_file():
                  files.append({"name": path.name, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()})
          Path("release/release-manifest.json").write_text(
              json.dumps({"commit": os.environ["GITHUB_SHA"], "version": version, "files": files}, indent=2) + "\n"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
